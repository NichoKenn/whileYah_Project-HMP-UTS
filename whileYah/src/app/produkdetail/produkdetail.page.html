<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Produk Detail</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/produk"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Produk Detail</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list lines="inset" inset="true">
    <ion-item>
      <ion-img [src]="produk[index].url ? produk[index].url : 'https://ubaya.cloud/no_image.jpg'"
        [alt]="produk[index].nama" style="width: auto; height: 400px;">
      </ion-img>
    </ion-item>

    <ion-item>
      <ion-label>
        <h1>{{produk[index].nama}}</h1>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        Kategori : {{produk[index].kategori}}
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        Stok : {{produk[index].stok}}
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        Harga Jual : {{produk[index].harga_jual}}
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        Harga Beli : {{produk[index].harga_beli}}
      </ion-label>
    </ion-item>
  </ion-list>
  <div class="ion-padding">

    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
      <ion-label style="font-weight: bold;">Atur Jumlah:</ion-label>

      <div style="display: flex; align-items: center;">
        <ion-button fill="outline" size="small" (click)="kurangJumlah()" [disabled]="jumlahBeli <= 1">
          <ion-icon name="remove"></ion-icon>
        </ion-button>
        <span style="margin: 0 15px; font-weight: bold; font-size: 18px;">
          {{ jumlahBeli }}
        </span>
        <ion-button fill="outline" size="small" (click)="tambahJumlah()" [disabled]="jumlahBeli >= produk[index].stok">
          <ion-icon name="add"></ion-icon>
        </ion-button>
      </div>
    </div>
    <ion-button expand="block" [disabled]="produk[index].stok===0" (click)="tambahKeKeranjang(produk[index])">
      <ion-icon name="cart" slot="start"></ion-icon>
      Tambah Ke Keranjang
    </ion-button>
  </div>
</ion-content>
