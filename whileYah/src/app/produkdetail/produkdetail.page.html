<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Produk Detail</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/produk"></ion-back-button>
    </ion-buttons>
    <ion-buttons slot="end">
        <ion-button color="secondary" routerLink="/editproduk/{{ index }}">
            <ion-icon name="create-outline"></ion-icon>
              <ion-label>Edit Produk</ion-label>
        </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Produk Detail</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list lines="inset" inset="true">
    <ion-item>
      <ion-img [src]="produk[index].url ? produk[index].url : 'https://ubaya.cloud/no_image.jpg'"
        [alt]="produk[index].nama" style="width: auto; height: 400px;">
      </ion-img>
    </ion-item>

    <ion-item>
      <ion-label>
        <h1><b>{{produk[index].nama}}</b></h1>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        ID Produk : {{produk[index].id}}
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        Kategori : {{produk[index].kategori}}
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        Stok : {{produk[index].stok}}
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        Harga Jual : <ion-text color="secondary"><b>Rp {{produk[index].harga_jual}}</b></ion-text>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        Harga Beli : Rp {{produk[index].harga_beli}}
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
