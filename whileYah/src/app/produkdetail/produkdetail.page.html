<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Produk Detail</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/produk"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Produk Detail</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list lines="inset" inset="true">
    <ion-item>
      <ion-img [src]="produk[index].url" [alt]="produk[index].nama" style="width: auto; height: 400px;"></ion-img>
    </ion-item>

    <ion-item>
      <ion-label>
        <h1>{{produk[index].nama}}</h1>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        Kategori : {{produk[index].kategori}}
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        Stok : {{produk[index].stok}}
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        Harga Jual : {{produk[index].harga_jual}}
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        Harga Beli : {{produk[index].harga_beli}}
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
