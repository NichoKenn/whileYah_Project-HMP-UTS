<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Tambah Produk Baru</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/produk"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ion-padding">
    <ion-list>
      <ion-item>
        <ion-input label="Nama Produk" labelPlacement="floating" placeholder="Masukkan nama produk"
          type="text" [(ngModel)]="nama" name="nama">
        </ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="isSubmitted && nama === ''">
        <p style="padding-left: 16px; font-size: 12px; margin-top: 5px; color: var(--ion-color-danger);">Nama produk wajib diisi.</p>
      </ion-text>

      <ion-item>
        <ion-input type="url" label="URL Gambar" labelPlacement="floating" placeholder="https://contoh.com/gambar.jpg"
          [(ngModel)]="url" name="url">
        </ion-input>
      </ion-item>
      <img *ngIf="url" [src]="url" style="max-width: 150px; max-height: 150px; object-fit: cover; margin: 10px auto; display: block;" />

      <ion-item>
        <ion-input type="number" label="Stok" labelPlacement="floating" placeholder="Masukkan jumlah stok"
          [(ngModel)]="stok" name="stok">
        </ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="isSubmitted && stok < 0">
        <p style="padding-left: 16px; font-size: 12px; margin-top: 5px; color: var(--ion-color-danger);">Stok tidak boleh negatif.</p>
      </ion-text>

      <ion-item>
        <ion-input type="number" label="Harga Beli (Rp)" labelPlacement="floating" placeholder="Masukkan harga beli"
          [(ngModel)]="harga_beli" name="harga_beli">
        </ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="isSubmitted && harga_beli <= 0">
        <p style="padding-left: 16px; font-size: 12px; margin-top: 5px; color: var(--ion-color-danger);">Harga beli harus lebih dari 0.</p>
      </ion-text>

      <ion-item>
        <ion-input type="number" label="Harga Jual (Rp)" labelPlacement="floating" placeholder="Masukkan harga jual"
          [(ngModel)]="harga_jual" name="harga_jual">
        </ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="isSubmitted && harga_jual <= 0">
        <p style="padding-left: 16px; font-size: 12px; margin-top: 5px; color: var(--ion-color-danger);">Harga jual harus lebih dari 0.</p>
      </ion-text>

      <ion-item>
        <ion-select label="Kategori" labelPlacement="floating" placeholder="Pilih kategori"
          [(ngModel)]="kategori" name="kategori">
          <ion-select-option *ngFor="let kat of arr_kategori" [value]="kat">{{ kat }}</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-text color="danger" *ngIf="isSubmitted && kategori === ''">
        <p style="padding-left: 16px; font-size: 12px; margin-top: 5px; color: var(--ion-color-danger);">Kategori wajib dipilih.</p>
      </ion-text>

      <ion-item lines="none">
        <ion-button (click)="submitProduk()" expand="block" style="width: 100%; margin-top: 16px;"> Simpan Produk </ion-button>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
