<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Tambah Produk Baru</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/produk"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="produkForm" (ngSubmit)="submitProduk()">
    <ion-list>
      <ion-item>
        <ion-input label="Nama Produk" labelPlacement="floating" placeholder="Masukkan nama produk" 
          formControlName="nama">
        </ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="(produkForm.get('nama')?.touched || isSubmitted) && produkForm.get('nama')?.errors?.['required']">
        <p style="padding-left: 16px; font-size: 12px; margin-top: 5px;">Nama produk wajib diisi.</p>
      </ion-text>

      <ion-item>
        <ion-input type="url" label="URL Gambar" labelPlacement="floating" placeholder="https://contoh.com/gambar.jpg" 
          formControlName="url">
        </ion-input>
      </ion-item>
      <img *ngIf="produkForm.get('url')?.value" [src]="produkForm.get('url')?.value" style="max-width: 150px; max-height: 150px; object-fit: cover; margin: 10px auto; display: block;" />

      <ion-item>
        <ion-input type="number" label="Stok" labelPlacement="floating" placeholder="Masukkan jumlah stok" 
          formControlName="stok">
        </ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="(produkForm.get('stok')?.touched || isSubmitted) && produkForm.get('stok')?.errors?.['required']">
        <p style="padding-left: 16px; font-size: 12px; margin-top: 5px;">Stok wajib diisi.</p>
      </ion-text>
      <ion-text color="danger" *ngIf="(produkForm.get('stok')?.touched || isSubmitted) && produkForm.get('stok')?.errors?.['min']">
        <p style="padding-left: 16px; font-size: 12px; margin-top: 5px;">Stok tidak boleh negatif.</p>
      </ion-text>

      <ion-item>
        <ion-input type="number" label="Harga Beli (Rp)" labelPlacement="floating" placeholder="Masukkan harga beli" 
          formControlName="harga_beli">
        </ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="(produkForm.get('harga_beli')?.touched || isSubmitted) && produkForm.get('harga_beli')?.errors?.['required']">
        <p style="padding-left: 16px; font-size: 12px; margin-top: 5px;">Harga beli wajib diisi.</p>
      </ion-text>
      <ion-text color="danger" *ngIf="(produkForm.get('harga_beli')?.touched || isSubmitted) && produkForm.get('harga_beli')?.errors?.['min']">
        <p style="padding-left: 16px; font-size: 12px; margin-top: 5px;">Harga beli harus lebih dari 0.</p>
      </ion-text>

      <ion-item>
        <ion-input type="number" label="Harga Jual (Rp)" labelPlacement="floating" placeholder="Masukkan harga jual" 
          formControlName="harga_jual">
        </ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="(produkForm.get('harga_jual')?.touched || isSubmitted) && produkForm.get('harga_jual')?.errors?.['required']">
        <p style="padding-left: 16px; font-size: 12px; margin-top: 5px;">Harga jual wajib diisi.</p>
      </ion-text>
      <ion-text color="danger" *ngIf="(produkForm.get('harga_jual')?.touched || isSubmitted) && produkForm.get('harga_jual')?.errors?.['min']">
        <p style="padding-left: 16px; font-size: 12px; margin-top: 5px;">Harga jual harus lebih dari 0.</p>
      </ion-text>

      <ion-item>
        <ion-select label="Kategori" labelPlacement="floating" placeholder="Pilih kategori" 
          formControlName="kategori">
          <ion-select-option *ngFor="let kat of arr_kategori" [value]="kat">{{ kat }}</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-text color="danger" *ngIf="(produkForm.get('kategori')?.touched || isSubmitted) && produkForm.get('kategori')?.errors?.['required']">
        <p style="padding-left: 16px; font-size: 12px; margin-top: 5px;">Kategori wajib dipilih.</p>
      </ion-text>

      <ion-item lines="none">
        <ion-button type="submit" expand="block" style="width: 100%; margin-top: 16px;"> Simpan Produk </ion-button>
      </ion-item>
    </ion-list>
  </form>
</ion-content>
