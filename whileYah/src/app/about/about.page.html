<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Tentang</ion-title>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tentang</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="frame">
    <ion-avatar>
      <ion-img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTP6KXZQNq0hmM1Elku6FgTadTSuunSeHOgQBTA07-pXQ&s=10"
      ></ion-img>
    </ion-avatar>
  </div>

  <ion-card class="agaknaik">
    <ion-card-content class="tengah_atasberjarak">
      <ion-item lines="none">
        <ion-label style="text-align: center; font-size: 20px"
          >Tentang Aplikasi</ion-label
        >
      </ion-item>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-label style="font-size: 18px">Info Aplikasi</ion-label>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label>Nama:</ion-label>
        <ion-label>SIMOBILE</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Versi:</ion-label>
        <ion-label>1.0</ion-label>
      </ion-item>
      <ion-item>
        <ion-label position="stacked" style="font-size: 22px"
          >Deskripsi:</ion-label
        >
        <ion-textarea
          [autoGrow]="true"
          value="Aplikasi kasir praktis khusus dirancang untuk Bu Marni agar pencatatan penjualan dan stok barang tidak lagi merepotkan, serta tetap bisa digunakan tanpa sinyal internet."
        >
        </ion-textarea>
      </ion-item>
      <ion-item>
        <ion-label>Hubungi Kami:</ion-label>
        <ion-label>sihelper@gmail.com</ion-label>
      </ion-item>
    </ion-card-content>
  </ion-card>

  <ion-item lines="none">
    <div
      style="
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      "
    >
      <ion-label style="font-size: 12px">Copyright</ion-label>
      <ion-img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTduw8cUzySCrd-22faXi7WQBjJ2jJs0AhfqAqnAJ-dqw&s=10"
        style="width: 10px"
      ></ion-img>
      <ion-label style="font-size: 12px">2026 whileYah Project</ion-label>
    </div>
  </ion-item>
</ion-content>
