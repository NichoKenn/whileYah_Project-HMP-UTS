<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Profil</ion-title>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Profil</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="frame">
    <ion-avatar id="myAvatar">
      <ion-img
        src="https://cdn.pixabay.com/photo/2023/09/10/17/57/woman-8245439_1280.jpg"
      ></ion-img>
    </ion-avatar>
  </div>

  <ion-card class="agaknaik">
    <ion-card-content class="tengah_atasberjarak">
      <ion-item lines="none">
        <ion-label style="text-align: center">Halo, {{namaPengguna}}</ion-label>
      </ion-item>
    </ion-card-content>
  </ion-card>

  <ion-card id="infoProfil">
    <ion-card-header>
      <ion-label style="font-size: 18px">Info Profil Toko</ion-label>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label>Nama Toko:</ion-label>
        <ion-label>Makmur Jaya</ion-label>
      </ion-item>
      <ion-item>
        <ion-label position="stacked" style="font-size: 22px">Alamat:</ion-label>
        <ion-textarea
          [autoGrow]="true"
          value="Jl. Tenggilis Mejoyo No.4, Kali Raungkut, Kec.Rungkut, Surabaya, Jawa Timur 60923"
        ></ion-textarea>
      </ion-item>
      <ion-item>
        <ion-label position="stacked" style="font-size: 22px">Bio:</ion-label>
        <ion-textarea
          [autoGrow]="true"
          value="Toko yang menyediakan berbagai kebutuhan pokok sehari-hari dengan harga terjangkau dan pilihan produk yang lengkap. Kami menyediakan beragam kebutuhan sembako, camilan, obat, minuman, dan kebersihan. Dengan mengutamakan kualitas, harga bersahabat, dan pelayanan yang ramah, kami berkomitmen untuk menjadi pilihan terpercaya bagi masyarakat dalam memenuhi kebutuhan sehari-hari."
        ></ion-textarea>
      </ion-item>
      <ion-item>
        <ion-label>Instagram:</ion-label>
        <ion-label>@tokomakmurjaya</ion-label>
      </ion-item>
    </ion-card-content>
  </ion-card>

  <ion-card id="infoPribadi">
    <ion-card-header>
      <ion-label style="font-size: 18px">Info Pribadi</ion-label>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label>ID Pengguna:</ion-label>
        <ion-label>USR-12345</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Nama Lengkap:</ion-label>
        <ion-label>Marni Sari Wulandari</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Email:</ion-label>
        <ion-label>marnimakmur@gmail.com</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Nomor Telepon:</ion-label>
        <ion-label>081382914275</ion-label>
      </ion-item>
    </ion-card-content>
  </ion-card>
</ion-content>
