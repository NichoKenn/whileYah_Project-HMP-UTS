<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Profil</ion-title>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Profil</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="frame">
    <ion-avatar>
      <ion-img src="https://cdn.pixabay.com/photo/2023/09/10/17/57/woman-8245439_1280.jpg"></ion-img>
    </ion-avatar>
  </div>

  <ion-card class="agaknaik">
    <ion-card-content class="tengah_atasberjarak">
      <ion-item>
        <ion-label style="text-align: center;">Halo, {{namaPengguna}}</ion-label>
      </ion-item>
      <ion-button fill="clear" color="primary">
        Ubah Foto Profil
      </ion-button>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-label style="font-size: 18px;">Info Profil Toko</ion-label>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label>Nama Toko</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Alamat</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Bio</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Medsos</ion-label>
      </ion-item>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-label style="font-size: 18px;">Info Pribadi</ion-label>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label>ID Pengguna</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Nama Lengkap</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Email</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Nomor HP</ion-label>
      </ion-item>
    </ion-card-content>
  </ion-card>

</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-title size="small"><ion-text color="secondary"><b>Ingin mengubah Data Profil ?</b></ion-text></ion-title>
    <ion-button slot="end" color="primary" class="ion-margin-end">
      Ubah Data
    </ion-button>
  </ion-toolbar>
</ion-footer>
