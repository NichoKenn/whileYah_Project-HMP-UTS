<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Transaksi</ion-title>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-list *ngIf="isiTransaksi.length > 0">
    <ion-card *ngFor="let item of isiTransaksi; let i = index">
      <ion-card-header>
        <ion-item>
          <ion-label>
            <ion-badge color="primary">{{item.id}}</ion-badge>
            <h2><b>{{ item.namaProduk }}</b></h2>
            <p>Jumlah: {{ item.jumlah }}</p>
          </ion-label>
          <ion-note slot="end" color="secondary">
            Tanggal: {{ item.tanggal }}
          </ion-note>
        </ion-item>
        <ion-item>
          <ion-label>Total belanja: Rp.{{ item.totalHarga }}</ion-label>
        </ion-item>
      </ion-card-header>
    </ion-card>
  </ion-list>

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Transaksi</ion-title>
    </ion-toolbar>
  </ion-header>
</ion-content>
