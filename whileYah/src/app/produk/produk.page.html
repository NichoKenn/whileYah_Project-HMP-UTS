<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Produk</ion-title>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button routerLink="/keranjang">
        <ion-icon name="cart"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Produk</ion-title>
    </ion-toolbar>
  </ion-header>
    <ion-searchbar [(ngModel)]="searchTerm" placeholder="Ketik nama barang disini..."></ion-searchbar>
  <ion-grid>
    <ion-row *ngFor="let produk2 of chunkArray(filterProduk(), 2); let i = index">
      <ion-col *ngFor="let data of produk2; let i2 = index">
        <ion-list>
          <ion-item class="gambar-produk">
            <ion-img [src]="data.url"></ion-img>
          </ion-item>

          <ion-item class="nama-produk" routerLink="/produkdetail/{{getOriginalIndex(data)}}">
            {{data.nama}}
          </ion-item>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>

<ion-fab vertical="bottom" horizontal="end" slot="fixed" class="fab-kiri">
  <ion-fab-button routerLink="/produkbaru">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>
</ion-content>
