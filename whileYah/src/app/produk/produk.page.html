<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Produk</ion-title>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row>
      <ion-col size="6" *ngFor="let data of produk">
        <ion-card>
          <img [src]="data.url" [alt]="data.nama" style="
              display: block;
              margin: 0 auto;
              max-width: 100%;
              height: auto;
            " width="300px" />

          <ion-card-header>
            <ion-item>
              <ion-card-title>{{data.nama}}</ion-card-title>
            </ion-item>

          </ion-card-header>

          <ion-card-content>
            <ion-item>
              <ion-label>Kategori : {{data.kategori}}</ion-label>
            </ion-item>
            <ion-item>
              <ion-label>Stok : {{data.stok}}</ion-label>
            </ion-item>
            <ion-item>
              <ion-label>Harga Jual : {{data.harga_jual}}</ion-label>
            </ion-item>
            <ion-item>
              <ion-label>Harga Beli : {{data.harga_beli}}</ion-label>
            </ion-item>
          </ion-card-content>

        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
