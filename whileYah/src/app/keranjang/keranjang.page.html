<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Keranjang Belanja</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/produk"></ion-back-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="muatKeranjang()">
        <ion-icon name="refresh"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list *ngIf="isiKeranjang.length > 0">
    <ion-item *ngFor="let item of isiKeranjang; let i = index">
      <ion-label>
        <h2><b>{{ item.nama }}</b></h2>
        <p>Jumlah: {{ item.jumlah }} x Rp {{ item.harga_jual }}</p>
      </ion-label>
      
      <ion-note slot="end" color="secondary">
        <b>Rp {{ item.jumlah * item.harga_jual }}</b>
      </ion-note>
      <ion-button slot="end" color="danger" fill="clear" (click)="hapus(i)">
        <ion-icon style="font-size : 32px "  name="trash"></ion-icon>
      </ion-button>
      
    </ion-item>
    
  </ion-list>

 
    <div *ngIf="isiKeranjang.length === 0">
      <p>Keranjang masih kosong.</p>
    </div>
  </ion-content>

<ion-footer *ngIf="isiKeranjang.length > 0">
  <ion-toolbar>
    <ion-title size="small"><ion-text color="secondary"><b>Rp {{ totalBelanja }}</b></ion-text></ion-title>
    <ion-button id="btnConfirm" slot="end" color="primary" class="ion-margin-end" (click)="checkout()">
      Konfirmasi Transaksi
    </ion-button>
    <ion-alert
        trigger="btnConfirm"
        header="Info Transaksi"
        message="Transaksi sukses, data telah ditambahkan!"
        [buttons]="alertButtons"
      ></ion-alert>
  </ion-toolbar>
</ion-footer>
