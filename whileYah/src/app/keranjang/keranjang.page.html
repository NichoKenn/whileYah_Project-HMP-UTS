<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Keranjang Belanja</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/produk"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list *ngIf="isiKeranjang.length > 0">
    <ion-item-sliding *ngFor="let item of isiKeranjang; let i = index">
      <ion-item>
        <ion-label>
          <h2><b>{{ item.nama }}</b></h2>
          <p>Jumlah: {{ item.jumlah }} x Rp {{ item.harga_jual }}</p>
        </ion-label>
        <ion-note slot="end" color="primary">
          Rp {{ item.jumlah * item.harga_jual }}
        </ion-note>
      </ion-item>
      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="hapus(i)">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>

    </ion-item-sliding> 
    
  </ion-list>

 
    <div *ngIf="isiKeranjang.length === 0">
      <p>Keranjang masih kosong.</p>
    </div>
  </ion-content>

<ion-footer *ngIf="isiKeranjang.length > 0">
  <ion-toolbar>
    <ion-title size="small">Total: Rp {{ totalBelanja }}</ion-title>
    <ion-button slot="end" color="success" class="ion-margin-end" (click)="checkout()">
      Konfirmasi Transaksi
    </ion-button>
  </ion-toolbar>
</ion-footer>
